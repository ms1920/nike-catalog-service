server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # The bundle is content-hashed by Vite, so it can be cached hard and forever.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # index.html must never be cached, or a client keeps loading an old bundle that
  # references asset hashes the server no longer has.
  location = /index.html {
    add_header Cache-Control "no-store, must-revalidate";
  }

  # Same-origin API proxy, so the browser needs no CORS preflight and the bundle
  # needs no absolute API URL baked in at build time.
  location /api/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # Preserved so the API's rate limiter keys on the real client, not on the
    # proxy's address — otherwise every user shares one bucket.
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /health {
    proxy_pass http://api:3000/health;
  }

  # Single-page app: unknown paths resolve to the shell so client routing works on
  # a hard refresh.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
