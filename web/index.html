    <title>Nike. Just Do It.</title>

    <!--
      Nike ships Helvetica Now Text / Display, proprietary Monotype faces that
      cannot be redistributed. Inter Tight + Inter is the substitution: the same
      neo-grotesque skeleton with tight apertures, open-licensed. Nike's own
      nike.com/in font stack lists Inter as a fallback.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Inter+Tight:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
